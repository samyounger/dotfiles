name: Pipeline

on:
  push: {}
  pull_request:
    types: [closed]
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Build
        run: go build ./...
      - name: Run unit tests
        run: go test -v ./...
      - name: Run gofmt
        run: gofmt -l -s -w .
      - name: Check for unformatted files
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not properly formatted:" >&2
            gofmt -l .
            exit 1
          fi
