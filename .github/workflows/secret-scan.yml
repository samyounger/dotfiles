name: Secret Scan

on:
  pull_request: {}
  push: {}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned gitleaks version
        id: gitleaks-version
        shell: bash
        run: |
          version="$(awk '$1 == "gitleaks" { print $2 }' runcom/.tool-versions)"
          if [ -z "$version" ]; then
            echo "gitleaks version not found in runcom/.tool-versions" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            "ghcr.io/gitleaks/gitleaks:v${{ steps.gitleaks-version.outputs.version }}" \
            git --no-banner --redact .
